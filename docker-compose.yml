# SaaSquatch Leads (Company Finder + Lead Qualifier) + Postgres 16.
#   docker compose up --build        -> http://localhost:3001 (host port set below)
# Companies, tracked searches, saved lists and the lookup cache persist in the "pgdata" volume.
services:
  app:
    build: .
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgres://leads:leads@db:5432/leads
      SCRAPE_INTERVAL_MINUTES: "30"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: leads
      POSTGRES_PASSWORD: leads
      POSTGRES_DB: leads
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leads"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
